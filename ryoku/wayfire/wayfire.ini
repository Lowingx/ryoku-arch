# Ryoku's baseline Wayfire configuration.
#
# The first layer of the composed wayfire.ini: `ryoku wm apply` lays the
# settings store over this file, then the machine's monitors.ini,
# keyboard.ini and user.ini win key by key. Every update replaces this file,
# so never edit it; your changes belong in user.ini.
#
# Every section below belongs to a plugin in core.plugins (or to core
# itself), so everything here actually runs.

[core]

# The session's plugins, alphabetical. Some carry settings or verbs the rest
# of the desktop leans on, so they must stay listed: animate (animations and
# their durations), autostart (the store's startup rows), command and
# decoration (the store's binds and borders), fast-switcher (Alt-Tab),
# vswipe (the workspace gesture), window-rules (the store's window rules),
# wm-actions (the fullscreen act), ipc and ipc-rules (state, watch and every
# act). apply removes animate and blur again when their store toggles are off.
plugins = \
  animate \
  autostart \
  blur \
  command \
  decoration \
  depthdeck \
  fast-switcher \
  grid \
  ipc \
  ipc-rules \
  move \
  place \
  resize \
  vswipe \
  vswitch \
  window-rules \
  wm-actions \
  wobbly \
  zoom

# Workspaces in a 3 x 3 grid.
vwidth = 3
vheight = 3

# Prefer the application's own decoration when it draws one; wayfire's
# borders cover the rest.
preferred_decoration_mode = client

# Drag windows with Super and the left mouse button.
[move]
activate = <super> BTN_LEFT

# Resize with Super and the right mouse button.
[resize]
activate = <super> BTN_RIGHT

# Zoom the desktop with Super and the scroll wheel.
[zoom]
modifier = <super>

# Session startup. The store's own rows land here beside this one as
# ryoku_NN keys and win per key.
[autostart]
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY

# Everyday commands. apply writes the catalogue's binds here as
# binding_<id>/command_<id> pairs, and the store's own keybinds land beside
# them as ryoku_N.
[command]

# Alt-Tab through the windows; the reverse direction follows.
[fast-switcher]
activate_forward = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB

# Tile the focused window into screen regions; the keypad mirrors the grid.
[grid]
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
# Restore the default geometry.
restore = <super> KEY_DOWN | <super> KEY_KP0

# Workspace movement; the store writes the switch duration into this section.
[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_down = <ctrl> <super> KEY_DOWN
binding_up = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT
# Move the focused window with the same bindings plus Shift.
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
